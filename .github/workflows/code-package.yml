name: Formal code package
on:
  push:
    branches: [main, codex/fix-repository-review]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PC test dependencies
        run: python -m pip install -r '代码包/PC端部署与报告工具/requirements-pc.txt'
      - name: Validate and test the formal package
        run: |
          python 代码包/管理代码包.py check
          python 代码包/管理代码包.py test
      - name: Build runtime and source archive
        run: |
          python 代码包/管理代码包.py build
          python 代码包/管理代码包.py zip
